name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOSは署名まわりが安定している macos-14(Apple Silicon)に固定
          # 自動アップデート用に zip / blockmap / latest*.yml もリリースへ添付する
          - os: macos-14
            platform: mac
            artifact: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: windows-latest
            platform: win
            artifact: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # macOS: 署名証明書を自前のキーチェーンに取り込む。
      # electron-builder が一時キーチェーンを作る方式は、ランナーのOS更新で
      # SecKeychainUnlock 等の失敗を繰り返したため、作成・ロック解除・権限付与をここで行う。
      - name: Import signing certificate (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # macOS: 公証(Apple)の認証を事前確認。失敗時はAppleの応答をそのままアノテーションに出す
      - name: Check notarization credentials (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if out=$(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1); then
            echo "notarytool: 認証OK"
          else
            echo "$out" | grep -v '^\s*$' | head -n 8 | while IFS= read -r l; do echo "::error title=Apple公証の認証エラー::${l:0:900}"; done
            exit 1
          fi

      # macOS: 署名(上で取り込んだ証明書を自動検出) + 公証
      - name: Build macOS (signed & notarized)
        if: matrix.platform == 'mac'
        shell: bash
        # 失敗時は原因の行(⨯ / Error / codesign など)をアノテーションとして出す(ログを開かずに原因が分かるように)
        run: |
          set -o pipefail
          npm run dist:mac -- --publish never 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            # 公証(notarytool)のHTTPエラー本文を最優先で出す
            grep -E "HTTP|agreement|401|403|notary|Notariz|⨯" "$RUNNER_TEMP/build.log" \
              | grep -vE "^[[:space:]]+at |Executing\.\.\. codesign" | tail -n 9 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }
        env:
          DEBUG: electron-osx-sign*
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows: 署名なし(証明書env は一切渡さない)
      - name: Build Windows (unsigned)
        if: matrix.platform == 'win'
        run: npm run dist:win -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dakoku-less-${{ matrix.os }}
          path: ${{ matrix.artifact }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
